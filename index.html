<script>
/* =========================
   共通
========================= */

const ROOT =
  "https://raw.githubusercontent.com/otterlyclueless/pokemon-champions-data/main/";

const n = s =>
  String(s || "")
    .toLowerCase()
    .replace(/[ -]/g, "");


/* =========================
   タブ切り替え
========================= */

function tab(id) {
  document
    .querySelectorAll("section")
    .forEach(x => x.classList.remove("on"));

  const el = document.getElementById(id);

  if (el) {
    el.classList.add("on");
  }
}


/* =========================
   M-Cデータを安全に取得
========================= */

function mcPokemonList() {
  if (typeof MC_POKEMON_DATA === "undefined") {
    return [];
  }

  if (Array.isArray(MC_POKEMON_DATA)) {
    return MC_POKEMON_DATA;
  }

  if (typeof MC_POKEMON_DATA === "object") {
    return Object.entries(MC_POKEMON_DATA).map(
      ([name, data]) => ({
        name,
        ...(data || {})
      })
    );
  }

  return [];
}


function mcFind(name) {
  const list = mcPokemonList();

  return list.find(
    p => n(p.name) === n(name)
  );
}


/* =========================
   Dデータベース構築
========================= */

const basePokemon =
  Array.isArray(LocalData.pokemon)
    ? LocalData.pokemon
    : [];


const mcList = mcPokemonList();


/*
 * 同名ポケモンはM-Cデータを優先して統合
 */
const pokemonMap = new Map();


for (const p of basePokemon) {
  pokemonMap.set(n(p.name), {
    ...p
  });
}


for (const p of mcList) {
  const key = n(p.name);

  const old = pokemonMap.get(key) || {};

  pokemonMap.set(key, {
    ...old,
    ...p
  });
}


/*
 * M-C種族値を反映
 */
if (
  typeof MC_BASE_STATS !== "undefined" &&
  MC_BASE_STATS
) {
  for (const [name, stats] of Object.entries(MC_BASE_STATS)) {
    const key = n(name);
    const old = pokemonMap.get(key);

    if (old) {
      old.baseStats = {
        ...(old.baseStats || {}),
        ...stats
      };
    } else {
      pokemonMap.set(key, {
        name,
        types: [],
        baseStats: {
          ...stats
        },
        abilities: [],
        moves: []
      });
    }
  }
}


/*
 * M-C特性を反映
 */
if (
  typeof MC_ABILITIES !== "undefined" &&
  MC_ABILITIES
) {
  for (const [name, abilities] of Object.entries(MC_ABILITIES)) {
    const key = n(name);
    const old = pokemonMap.get(key);

    if (old) {
      old.abilities = Array.isArray(abilities)
        ? [...abilities]
        : abilities;
    }
  }
}


/*
 * M-CタイプをMC_POKEMON_DATAから補完
 */
for (const p of mcList) {
  const old = pokemonMap.get(n(p.name));

  if (!old) continue;

  if (Array.isArray(p.types) && p.types.length > 0) {
    old.types = [...p.types];
  }
}


/* =========================
   D本体
========================= */

const D = {

  pokemon: [...pokemonMap.values()],

  moves: {
    ...(LocalData.moves || {})
  },

  abilities: {
    ...(LocalData.abilities || {})
  },

  items: {
    ...(LocalData.items || {})
  },

  learnsets: {},

  base: {}
};


/*
 * M-C技
 */
if (
  typeof MC_MOVES !== "undefined" &&
  MC_MOVES
) {
  Object.assign(D.moves, MC_MOVES);
}


/*
 * 全ポケモンの種族値をD.baseへ
 */
for (const p of D.pokemon) {

  if (!p.name) continue;

  D.base[n(p.name)] = {
    ...(p.baseStats || {})
  };
}


/*
 * M-C種族値を最終上書き
 */
if (
  typeof MC_BASE_STATS !== "undefined" &&
  MC_BASE_STATS
) {
  for (const [name, stats] of Object.entries(MC_BASE_STATS)) {
    D.base[n(name)] = {
      ...(D.base[n(name)] || {}),
      ...stats
    };
  }
}


/* =========================
   ポケモン検索
========================= */

function findP(x) {

  return D.pokemon.find(
    p => n(p.name) === n(x)
  );
}


/* =========================
   種族値取得
========================= */

function base(x) {

  return D.base[n(x)] || {};
}


/* =========================
   技取得
========================= */

function movesForPokemon(x) {

  const p = findP(x);

  if (!p) {
    return [];
  }

  /*
   * ポケモン自身にmovesがあれば使う
   */
  if (
    Array.isArray(p.moves) &&
    p.moves.length > 0
  ) {
    return [
      ...new Set(
        p.moves
          .map(v =>
            typeof v === "string"
              ? v
              : v && v.move
          )
          .filter(Boolean)
      )
    ].slice(0, 4);
  }

  return [];
}


/* =========================
   デフォルトSP
========================= */

function defaultSP(name) {

  const p = findP(name);

  const b = base(name);

  /*
   * ポケモンごとの簡易型
   */

  const sp = {
    hp: 2,
    atk: 0,
    def: 0,
    spa: 0,
    spd: 0,
    spe: 32
  };

  if (!p) {
    return sp;
  }

  /*
   * 特殊寄り
   */
  if (
    (b.spa || 0) >
    (b.atk || 0)
  ) {
    sp.atk = 0;
    sp.spa = 32;
  } else {
    sp.atk = 32;
  }

  /*
   * 素早さが極端に低い場合
   */
  if ((b.spe || 0) < 60) {
    sp.spe = 2;
    sp.hp = 32;
  }

  return sp;
}


/* =========================
   デフォルト持ち物
========================= */

function defaultItem(name) {

  const p = findP(name);

  if (!p) {
    return "";
  }

  const b = base(name);

  if ((b.spa || 0) >= (b.atk || 0) + 15) {
    return "Choice Specs";
  }

  if ((b.spe || 0) >= 100) {
    return "Choice Scarf";
  }

  return "Leftovers";
}


/* =========================
   デフォルト特性
========================= */

function defaultAbility(name) {

  const p = findP(name);

  if (!p) {
    return "";
  }

  if (
    Array.isArray(p.abilities) &&
    p.abilities.length > 0
  ) {
    return p.abilities[0];
  }

  if (
    p.abilities &&
    typeof p.abilities === "object"
  ) {
    return Object.keys(p.abilities)[0] || "";
  }

  return "";
}


/* =========================
   ① パーティー構築
========================= */

window.makeTeam = function() {

  try {

    const seedEl =
      document.getElementById("seed");

    const outEl =
      document.getElementById("teamOut");

    const names =
      seedEl.value
        .split(",")
        .map(x => x.trim())
        .filter(Boolean);


    const team = [];

    const used = new Set();


    /*
     * 入力されたポケモンを優先
     */

    for (const name of names) {

      const p = findP(name);

      if (
        p &&
        !used.has(n(p.name))
      ) {

        team.push(p);

        used.add(n(p.name));
      }
    }


    /*
     * 足りない分をデータから補充
     */

    for (const p of D.pokemon) {

      if (team.length >= 6) {
        break;
      }

      if (
        !used.has(n(p.name))
      ) {

        team.push(p);

        used.add(n(p.name));
      }
    }


    /*
     * 最大6体
     */

    const result =
      team.slice(0, 6).map(p => {

        return {

          name: p.name,

          types:
            Array.isArray(p.types)
              ? [...p.types]
              : [],

          sp:
            defaultSP(p.name),

          ability:
            defaultAbility(p.name),

          item:
            defaultItem(p.name),

          moves:
            movesForPokemon(p.name)

        };

      });


    outEl.textContent =
      JSON.stringify(
        result,
        null,
        2
      );


  } catch (e) {

    document.getElementById(
      "teamOut"
    ).textContent =
      "エラー: " + e.message;

    console.error(e);
  }
};


/* =========================
   ② 合法性チェック
========================= */

function legal() {

  try {

    const input =
      document.getElementById(
        "legalIn"
      ).value;

    const t =
      JSON.parse(input);

    const errors = [];

    const seen =
      new Set();


    if (
      !Array.isArray(t) ||
      t.length !== 6
    ) {
      errors.push(
        "6体必要です"
      );
    }


    if (Array.isArray(t)) {

      for (const p of t) {

        if (!p || !p.name) {
          errors.push(
            "名前がないポケモンがあります"
          );
          continue;
        }


        const key =
          n(p.name);


        if (seen.has(key)) {

          errors.push(
            "同種重複: " + p.name
          );

        }

        seen.add(key);


        const data =
          findP(p.name);


        if (!data) {

          errors.push(
            "未知ポケモン: " +
            p.name
          );

          continue;
        }


        const sp =
          p.sp || {};


        const values =
          [
            "hp",
            "atk",
            "def",
            "spa",
            "spd",
            "spe"
          ].map(
            k => +sp[k] || 0
          );


        const sum =
          values.reduce(
            (a, b) => a + b,
            0
          );


        if (sum > 66) {

          errors.push(
            p.name +
            ": SP合計66超過"
          );

        }


        if (
          values.some(
            v => v > 32
          )
        ) {

          errors.push(
            p.name +
            ": 1能力32超過"
          );

        }


        if (
          Array.isArray(p.moves) &&
          p.moves.length > 4
        ) {

          errors.push(
            p.name +
            ": 技4つ超過"
          );

        }

      }
    }


    document.getElementById(
      "legalOut"
    ).textContent =
      JSON.stringify(
        {
          valid:
            errors.length === 0,
          errors
        },
        null,
        2
      );


  } catch (e) {

    document.getElementById(
      "legalOut"
    ).textContent =
      "JSONエラー: " +
      e.message;

  }
}


/* =========================
   タイプ相性
========================= */

function typeEffectiveness(
  moveType,
  defenderTypes
) {

  if (
    !Array.isArray(defenderTypes) ||
    defenderTypes.length === 0
  ) {
    return 1;
  }


  let multiplier = 1;


  for (
    const type of defenderTypes
  ) {

    const row =
      D.typeChart
        ? D.typeChart[moveType]
        : LocalData.typeChart[moveType];


    if (
      row &&
      row[type] !== undefined
    ) {

      multiplier *=
        row[type];

    }

  }


  return multiplier;
}


/*
 * LocalDataのタイプ表をDにも持たせる
 */

D.typeChart =
  LocalData.typeChart || {};


/* =========================
   技ダメージ評価
========================= */

function moveScore(
  attacker,
  defender,
  moveName
) {

  const move =
    D.moves[moveName];


  if (!move) {
    return {
      score: 0,
      damage: 0,
      move: moveName
    };
  }


  const b =
    base(attacker.name);


  const db =
    base(defender.name);


  const attackStat =
    move.category === "Special"
      ? (b.spa || 1)
      : (b.atk || 1);


  const defenseStat =
    move.category === "Special"
      ? (db.spd || 1)
      : (db.def || 1);


  const power =
    move.power || 0;


  if (power <= 0) {

    return {
      score: 10,
      damage: 0,
      move: moveName
    };

  }


  const stab =
    Array.isArray(attacker.types) &&
    attacker.types.includes(move.type)
      ? 1.5
      : 1;


  const effectiveness =
    typeEffectiveness(
      move.type,
      defender.types
    );


  const raw =
    Math.floor(
      (
        (
          22 *
          power *
          attackStat
        ) /
        Math.max(
          1,
          defenseStat
        )
      ) /
        50
    ) + 2;


  const damage =
    Math.max(
      0,
      Math.floor(
        raw *
        stab *
        effectiveness
      )
    );


  return {

    score:
      damage,

    damage,

    move:
      moveName,

    type:
      move.type,

    effectiveness,

    stab

  };
}


/* =========================
   ③ 6→3選出
========================= */

function select3() {

  try {

    const myTeam =
      JSON.parse(
        document.getElementById(
          "myIn"
        ).value
      );


    const opponentTeam =
      JSON.parse(
        document.getElementById(
          "opIn"
        ).value
      );


    if (
      !Array.isArray(myTeam) ||
      !Array.isArray(opponentTeam)
    ) {

      throw new Error(
        "自分と相手の6体をJSON配列で入力してください"
      );

    }


    const candidates = [];


    /*
     * 6体から3体を全探索
     */

    for (
      let i = 0;
      i < myTeam.length;
      i++
    ) {

      for (
        let j = i + 1;
        j < myTeam.length;
        j++
      ) {

        for (
          let k = j + 1;
          k < myTeam.length;
          k++
        ) {

          const selection = [
            myTeam[i],
            myTeam[j],
            myTeam[k]
          ];


          let total = 0;

          const details = [];


          for (
            const mine of selection
          ) {

            let best = null;


            for (
              const opp of opponentTeam
            ) {

              const myMoves =
                Array.isArray(mine.moves)
                  ? mine.moves
                  : movesForPokemon(
                      mine.name
                    );


              for (
                const moveName of myMoves
              ) {

                const result =
                  moveScore(
                    mine,
                    opp,
                    moveName
                  );


                if (
                  !best ||
                  result.score >
                    best.score
                ) {

                  best = {
                    opponent:
                      opp.name,

                    ...result
                  };

                }

              }

            }


            if (best) {

              total +=
                best.score;


              details.push({

                pokemon:
                  mine.name,

                bestMatchup:
                  best.opponent,

                score:
                  best.score,

                bestMove:
                  best.move,

                effectiveness:
                  best.effectiveness

              });

            }

          }


          candidates.push({

            selection:
              selection.map(
                x => x.name
              ),

            evaluation:
              Math.round(
                total * 10
              ) / 10,

            matchupDetails:
              details

          });

        }

      }

    }


    candidates.sort(
      (a, b) =>
        b.evaluation -
        a.evaluation
    );


    document.getElementById(
      "selectOut"
    ).textContent =
      JSON.stringify(
        {
          input: {
            myTeam:
              myTeam.map(
                x => x.name
              ),

            opponentTeam:
              opponentTeam.map(
                x => x.name
              )
          },

          candidates:
            candidates.slice(
              0,
              10
            ),

          note:
            "6→3対面評価：タイプ相性・STAB・技威力・攻撃能力・相手タイプを考慮"

        },
        null,
        2
      );


  } catch (e) {

    document.getElementById(
      "selectOut"
    ).textContent =
      "エラー: " +
      e.message;

    console.error(e);
  }
}

    function effectiveness(moveType, defenderTypes){

          typeChart[moveType] &&
          typeChart[moveType][defType] !== undefined
            ? typeChart[moveType][defType]
            : 1;
      }

      return value;
    }

    function moveData(moveName){
      const list = D.moves || {};

      if(Array.isArray(list)){
        return list.find(m =>
          n(m.name) === n(moveName)
        ) || {};
      }

      const key = Object.keys(list).find(k =>
        n(k) === n(moveName)
      );

      return key ? list[key] : {};
    }

    function getMoveType(moveName){
      const m = moveData(moveName);

      return (
        m.type ||
        m.Type ||
        "Normal"
      );
    }

    function getCategory(moveName){
      const m = moveData(moveName);

      return (
        m.category ||
        m.Category ||
        "Status"
      );
    }

    function getPower(moveName){
      const m = moveData(moveName);

      const p =
        m.power ??
        m.Power ??
        0;

      return Number(p) || 0;
    }

    function getAccuracy(moveName){
      const m = moveData(moveName);

      const a =
        m.accuracy ??
        m.Accuracy ??
        100;

      return Number(a) || 100;
    }

    function getAttackStat(category){
      const b = base(myName);

      if(
        category === "Physical" ||
        category === "physical"
      ){
        return Number(b.atk || 1);
      }

      return Number(b.spa || 1);
    }

    function getDefenseStat(category){
      const b = base(opponentName);

      if(
        category === "Physical" ||
        category === "physical"
      ){
        return Number(b.def || 1);
      }

      return Number(b.spd || 1);
    }

    function evaluateMove(moveName){

      const type = getMoveType(moveName);
      const category = getCategory(moveName);
      const power = getPower(moveName);
      const accuracy = getAccuracy(moveName);

      const effect = effectiveness(
        type,
        oppTypes
      );

      const stab =
        effect === 0
          ? 1
          : myTypes.includes(type)
            ? 1.5
            : 1;

      const reasons = [];
      let score = 0;
      let damage = 0;

      if(effect === 0){

        score = -100;

        reasons.push("無効");

      }else if(
        category === "Status" ||
        category === "status" ||
        power === 0
      ){

        score = 20;

        if(
          /Nuzzle|Will-O-Wisp|Thunder Wave|Toxic/i
            .test(moveName)
        ){
          score += 25;
          reasons.push("状態異常");
        }

        if(
          /Protect/i.test(moveName)
        ){
          score += 20;
          reasons.push("Protect");
        }

      }else{

        const attack =
          getAttackStat(category);

        const defense =
          getDefenseStat(category);

        damage =
          Math.floor(
            (
              (
                2 * 50 / 5 + 2
              ) *
              power *
              attack /
              Math.max(1, defense)
              / 50
              + 2
            ) *
            stab *
            effect
          );

        score = damage * 2;

        if(effect > 1){
          score += 30;
          reasons.push("効果抜群");
        }

        if(effect < 1){
          score -= 20;
          reasons.push("いまひとつ");
        }

        if(stab > 1){
          reasons.push("STAB");
        }
      }

      if(
        accuracy < 100 &&
        accuracy > 0
      ){
        score *= accuracy / 100;
      }

      if(
        mySpeed > 0 &&
        oppSpeed > 0 &&
        mySpeed < oppSpeed
      ){
        if(
          /Protect/i.test(moveName)
        ){
          score += 10;
          reasons.push("相手が先に動く可能性");
        }
      }

      return {
        action:["move", moveName],
        move:moveName,
        category,
        score:Number(score.toFixed(2)),
        estimatedDamage:damage,
        typeEffect:effect,
        stab,
        accuracy,
        reason:reasons
      };
    }

    const candidates =
      myMoves.map(evaluateMove);

    /*
     * ベンチ交代候補
     */
    const bench =
      Array.isArray(me.bench)
        ? me.bench
        : [];

    for(const benchPokemon of bench){

      const name =
        typeof benchPokemon === "string"
          ? benchPokemon
          : benchPokemon.name;

      if(!name) continue;

      const p = findP(name);

      if(!p) continue;

      const pTypes =
        benchPokemon.types ||
        p.types ||
        [];

      let bestDamage = 0;
      let bestMove = null;

      const benchMoves =
        benchPokemon.moves ||
        moves(name) ||
        [];

      for(const moveName of benchMoves){

        const type =
          getMoveType(moveName);

        const category =
          getCategory(moveName);

        const power =
          getPower(moveName);

        const effect =
          effectiveness(
            type,
            oppTypes
          );

        if(effect <= 0 || power <= 0){
          continue;
        }

        const attack =
          category === "Physical"
            ? Number(base(name).atk || 1)
            : Number(base(name).spa || 1);

        const defense =
          category === "Physical"
            ? Number(base(opponentName).def || 1)
            : Number(base(opponentName).spd || 1);

        const stab =
          pTypes.includes(type)
            ? 1.5
            : 1;

        const damage =
          Math.floor(
            (
              (
                2 * 50 / 5 + 2
              ) *
              power *
              attack /
              Math.max(1, defense)
              / 50
              + 2
            ) *
            stab *
            effect
          );

        if(damage > bestDamage){
          bestDamage = damage;
          bestMove = moveName;
        }
      }

      /*
       * ベンチに有効打がある場合は
       * 交代候補として評価
       */
      if(bestMove){

        let switchScore =
          bestDamage * 2 + 20;

        if(
          mySpeed > 0 &&
          oppSpeed > 0
        ){
          const benchSpeed =
            Number(
              base(name).spe || 0
            );

          if(benchSpeed > oppSpeed){
            switchScore += 15;
          }
        }

        candidates.push({
          action:["switch", name],
          pokemon:name,
          score:Number(
            switchScore.toFixed(2)
          ),
          estimatedDamage:bestDamage,
          bestMove,
          reason:[
            "交代候補",
            "相手への有効打",
            bestMove
          ]
        });
      }
    }

    /*
     * 現在の技が全部無効なら
     * 交代を強く優先
     */
    const usableMoves =
      candidates.filter(x =>
        x.action[0] === "move" &&
        x.typeEffect > 0
      );

    const switchCandidates =
      candidates.filter(x =>
        x.action[0] === "switch"
      );

    if(
      usableMoves.length === 0 &&
      switchCandidates.length > 0
    ){
      for(const x of switchCandidates){
        x.score += 200;
        x.reason.push(
          "有効な攻撃技がないため交代を優先"
        );
      }
    }

    candidates.sort(
      (a,b) => b.score - a.score
    );

    const best =
      candidates[0] || null;

    document.getElementById(
      "battleOut"
    ).textContent =
      JSON.stringify({
        input:{
          me:myName,
          opponent:opponentName,
          mySpeed,
          opponentSpeed
        },
        bestAction:best,
        candidates:candidates.slice(0,10),
        note:
          "タイプ相性・STAB・技威力・攻撃能力・防御能力・素早さ・ベンチ交代を考慮した対戦AI"
      },null,2);

  }catch(e){

    document.getElementById(
      "battleOut"
    ).textContent =
      "エラー: " + e.message;

    console.error(e);
  }
}



/* =========================
   ⑤ 対戦レビュー
========================= */

function review() {

  try {

    const replay =
      JSON.parse(
        document.getElementById(
          "replayIn"
        ).value
      );


    const turns =
      Array.isArray(
        replay.turns
      )
        ? replay.turns
        : [];


    document.getElementById(
      "reviewOut"
    ).textContent =
      JSON.stringify(
        {

          turnCount:
            turns.length,

          turns,

          note:
            "入力された対戦ログを解析する基礎版。各ターンの状態JSONがあれば、AI候補との比較を追加できます。"

        },
        null,
        2
      );


  } catch (e) {

    document.getElementById(
      "reviewOut"
    ).textContent =
      "JSONエラー: " +
      e.message;

  }
}
