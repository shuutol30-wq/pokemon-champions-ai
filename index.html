function select3() {
  try {
    const myTeam = JSON.parse(
      document.getElementById("myIn").value
    );

    const oppTeam = JSON.parse(
      document.getElementById("opIn").value
    );

    if (!Array.isArray(myTeam) || myTeam.length !== 6) {
      throw new Error("自分の6体を入力してください");
    }

    if (!Array.isArray(oppTeam) || oppTeam.length !== 6) {
      throw new Error("相手の6体を入力してください");
    }

    // --------------------------------
    // ポケモン名を正規化
    // --------------------------------
    function key(name) {
      return String(name || "")
        .toLowerCase()
        .replace(/[\s_-]/g, "");
    }

    // --------------------------------
    // ポケモン情報を取得
    // --------------------------------
    function getPokemonData(p) {
      const local = LocalData.pokemon.find(
        x => key(x.name) === key(p.name)
      );

      return local || p;
    }

    // --------------------------------
    // タイプを補完
    // --------------------------------
    function getTypes(p) {
      const current =
        Array.isArray(p.types)
          ? p.types.filter(Boolean)
          : [];

      if (current.length > 0) {
        return current;
      }

      const local = getPokemonData(p);

      if (
        local &&
        Array.isArray(local.types)
      ) {
        return local.types;
      }

      return [];
    }

    // --------------------------------
    // 種族値を取得
    // --------------------------------
    function getStats(p) {
      const local = getPokemonData(p);

      if (
        local &&
        local.baseStats
      ) {
        return local.baseStats;
      }

      if (p.baseStats) {
        return p.baseStats;
      }

      return {};
    }

    // --------------------------------
    // 技を取得
    // --------------------------------
    function getMoves(p) {
      if (!Array.isArray(p.moves)) {
        return [];
      }

      return p.moves
        .map(m => {
          if (typeof m === "string") {
            return m;
          }

          return m && (
            m.name ||
            m.move
          );
        })
        .filter(Boolean);
    }

    // --------------------------------
    // 技データ
    // --------------------------------
    function getMoveData(name) {
      return LocalData.getMove(name);
    }

    // --------------------------------
    // タイプ相性
    // --------------------------------
    function typeEffect(
      moveType,
      defenderTypes
    ) {
      let result = 1;

      const chart =
        LocalData.typeChart[
          moveType
        ];

      if (!chart) {
        return result;
      }

      for (
        const type of defenderTypes
      ) {
        if (
          chart[type] !== undefined
        ) {
          result *= Number(
            chart[type]
          );
        }
      }

      return result;
    }

    // --------------------------------
    // 攻撃能力
    // --------------------------------
    function offensiveStat(
      attacker,
      move
    ) {
      const stats =
        getStats(attacker);

      if (
        move.category ===
        "Physical"
      ) {
        return Number(
          stats.atk || 0
        );
      }

      if (
        move.category ===
        "Special"
      ) {
        return Number(
          stats.spa || 0
        );
      }

      return 0;
    }

    // --------------------------------
    // 防御能力
    // --------------------------------
    function defensiveStat(
      defender,
      move
    ) {
      const stats =
        getStats(defender);

      if (
        move.category ===
        "Physical"
      ) {
        return Number(
          stats.def || 1
        );
      }

      if (
        move.category ===
        "Special"
      ) {
        return Number(
          stats.spd || 1
        );
      }

      return 1;
    }

    // --------------------------------
    // 1つの技による攻撃評価
    // --------------------------------
    function evaluateMove(
      attacker,
      defender,
      moveName
    ) {
      const move =
        getMoveData(moveName);

      if (!move) {
        return null;
      }

      if (
        move.category ===
        "Status"
      ) {
        return null;
      }

      const power =
        Number(move.power || 0);

      if (power <= 0) {
        return null;
      }

      const attack =
        offensiveStat(
          attacker,
          move
        );

      const defense =
        defensiveStat(
          defender,
          move
        );

      const defenderTypes =
        getTypes(defender);

      const attackerTypes =
        getTypes(attacker);

      const effectiveness =
        typeEffect(
          move.type,
          defenderTypes
        );

      // STAB
      const stab =
        attackerTypes.includes(
          move.type
        )
          ? 1.5
          : 1;

      // 命中率
      const accuracy =
        Number(
          move.accuracy || 100
        ) / 100;

      // 簡易ダメージモデル
      const baseDamage =
        (
          (
            (
              2 *
              100 /
              5
            ) + 2
          ) *
          power *
          attack /
          Math.max(
            defense,
            1
          )
        ) / 50
        + 2;

      const expectedDamage =
        baseDamage *
        stab *
        effectiveness *
        accuracy;

      return {
        move: moveName,
        power,
        category:
          move.category,
        attack,
        defense,
        effectiveness,
        stab,
        accuracy,
        damage:
          Number(
            expectedDamage.toFixed(2)
          )
      };
    }

    // --------------------------------
    // 最も有効な攻撃技
    // --------------------------------
    function bestMove(
      attacker,
      defender
    ) {
      let best = null;

      for (
        const moveName of
        getMoves(attacker)
      ) {
        const result =
          evaluateMove(
            attacker,
            defender,
            moveName
          );

        if (!result) {
          continue;
        }

        if (
          !best ||
          result.damage >
            best.damage
        ) {
          best = result;
        }
      }

      return best;
    }

    // --------------------------------
    // 素早さ
    // --------------------------------
    function speedValue(p) {
      const stats =
        getStats(p);

      let speed =
        Number(stats.spe || 0);

      const status =
        p.status;

      if (
        status ===
        "paralysis"
      ) {
        speed *= 0.5;
      }

      if (
        p.item ===
        "Choice Scarf"
      ) {
        speed *= 1.5;
      }

      return speed;
    }

    // --------------------------------
    // 1対1対面評価
    // --------------------------------
    function matchup(
      mine,
      opponent
    ) {
      const myBest =
        bestMove(
          mine,
          opponent
        );

      const oppBest =
        bestMove(
          opponent,
          mine
        );

      let score = 0;

      // 自分からのダメージ
      if (myBest) {
        score +=
          myBest.damage;
      }

      // 相手からのダメージ
      if (oppBest) {
        score -=
          oppBest.damage * 0.65;
      }

      // タイプ相性
      if (myBest) {
        if (
          myBest.effectiveness >= 4
        ) {
          score += 30;
        } else if (
          myBest.effectiveness >= 2
        ) {
          score += 15;
        } else if (
          myBest.effectiveness === 0
        ) {
          score -= 25;
        } else if (
          myBest.effectiveness < 1
        ) {
          score -= 10;
        }
      }

      // 相手から受ける相性
      if (oppBest) {
        if (
          oppBest.effectiveness >= 4
        ) {
          score -= 30;
        } else if (
          oppBest.effectiveness >= 2
        ) {
          score -= 15;
        } else if (
          oppBest.effectiveness === 0
        ) {
          score += 25;
        } else if (
          oppBest.effectiveness < 1
        ) {
          score += 10;
        }
      }

      // 素早さ
      const mySpeed =
        speedValue(mine);

      const oppSpeed =
        speedValue(opponent);

      if (
        mySpeed >
        oppSpeed
      ) {
        score += 8;
      } else if (
        mySpeed <
        oppSpeed
      ) {
        score -= 8;
      }

      return {
        score:
          Number(
            score.toFixed(2)
          ),

        myBestMove:
          myBest
            ? myBest.move
            : null,

        myDamage:
          myBest
            ? myBest.damage
            : 0,

        myEffectiveness:
          myBest
            ? myBest.effectiveness
            : 1,

        opponentBestMove:
          oppBest
            ? oppBest.move
            : null,

        opponentDamage:
          oppBest
            ? oppBest.damage
            : 0,

        opponentEffectiveness:
          oppBest
            ? oppBest.effectiveness
            : 1
      };
    }

    // --------------------------------
    // 3体選出の評価
    // --------------------------------
    function evaluateSelection(
      team
    ) {
      let total = 0;

      const details = [];

      // 各ポケモンについて
      // 相手6体との対面を平均評価
      for (
        const mine of team
      ) {
        let matchupTotal = 0;
        let wins = 0;
        let losses = 0;

        const opponents = [];

        for (
          const opponent of
          oppTeam
        ) {
          const result =
            matchup(
              mine,
              opponent
            );

          matchupTotal +=
            result.score;

          if (
            result.score > 20
          ) {
            wins++;
          }

          if (
            result.score < -20
          ) {
            losses++;
          }

          opponents.push({
            opponent:
              opponent.name,

            score:
              result.score,

            myBestMove:
              result.myBestMove,

            myDamage:
              result.myDamage,

            opponentBestMove:
              result.opponentBestMove,

            opponentDamage:
              result.opponentDamage,

            myEffectiveness:
              result.myEffectiveness,

            opponentEffectiveness:
              result.opponentEffectiveness
          });
        }

        const average =
          matchupTotal /
          oppTeam.length;

        total += average;

        details.push({
          pokemon:
            mine.name,

          types:
            getTypes(mine),

          averageScore:
            Number(
              average.toFixed(2)
            ),

          favorableMatchups:
            wins,

          unfavorableMatchups:
            losses,

          opponents
        });
      }

      // --------------------------------
      // 3体の役割バランス
      // --------------------------------
      const roles = [];

      for (
        const p of team
      ) {
        const stats =
          getStats(p);

        const atk =
          Number(
            stats.atk || 0
          );

        const spa =
          Number(
            stats.spa || 0
          );

        const spe =
          Number(
            stats.spe || 0
          );

        if (
          spe >= 100
        ) {
          roles.push("fast");
        } else if (
          atk >
          spa + 20
        ) {
          roles.push(
            "physical"
          );
        } else if (
          spa >
          atk + 20
        ) {
          roles.push(
            "special"
          );
        } else {
          roles.push(
            "balanced"
          );
        }
      }

      const uniqueRoles =
        new Set(roles);

      // 役割が複数あるほど少し加点
      total +=
        uniqueRoles.size * 5;

      // --------------------------------
      // タイプ重複ペナルティ
      // --------------------------------
      const typeCounts = {};

      for (
        const p of team
      ) {
        for (
          const type of
          getTypes(p)
        ) {
          typeCounts[type] =
            (typeCounts[type] || 0)
            + 1;
        }
      }

      for (
        const count of
        Object.values(typeCounts)
      ) {
        if (count >= 3) {
          total -=
            (count - 2) * 4;
        }
      }

      return {

          Number(
            total.toFixed(2)
          ),

        details,

      };
    }

    // --------------------------------
    // 6体から3体を全探索
    // --------------------------------
    const candidates = [];

    for (

      i++

      for (
