<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon Champions Singles AI</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f6fb;color:#172033;margin:0}header{background:#202b44;color:#fff;padding:20px}main{max-width:1100px;margin:auto;padding:18px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}button{padding:10px 14px;border:0;border-radius:9px;cursor:pointer}button.p{background:#405cf5;color:#fff}
section{display:none;background:#fff;padding:18px;border-radius:14px;box-shadow:0 2px 12px #0001}section.on{display:block}
textarea,input{box-sizing:border-box;width:100%;padding:9px;border:1px solid #ccd3e0;border-radius:8px;margin:5px 0 10px}pre{background:#111827;color:#eee;padding:14px;border-radius:10px;white-space:pre-wrap;overflow:auto}.muted{color:#667085}
</style></head><body>
<header><h1>Pokémon Champions Singles AI</h1><div>シングル専用・ブラウザ版</div></header><main>
<nav><button onclick="tab('team')">①パーティー</button><button onclick="tab('legal')">②合法性</button><button onclick="tab('select')">③6→3選出</button><button onclick="tab('battle')">④対戦AI</button><button onclick="tab('review')">⑤反省</button></nav>
<section id="team" class="on"><h2>パーティー構築</h2><p class="muted">希望ポケモンをカンマ区切りで入力。空欄ならデータから自動選択します。</p><input id="seed" placeholder="例: Garchomp,Rotom-Wash"><button class="p" onclick="makeTeam()">6体を生成</button><pre id="teamOut"></pre></section>
<section id="legal"><h2>合法性チェック</h2><textarea id="legalIn" placeholder="team.jsonを貼り付け"></textarea><button class="p" onclick="legal()">チェック</button><pre id="legalOut"></pre></section>
<section id="select"><h2>6→3選出</h2><textarea id="myIn" placeholder="自分の6体JSON"></textarea><textarea id="opIn" placeholder="相手の6体JSON"></textarea><button class="p" onclick="select3()">候補を探索</button><pre id="selectOut"></pre></section>
<section id="battle"><h2>対戦AI</h2><textarea id="battleIn" placeholder='{"me":{"active":{...},"bench":[]},"opp":{"active":{...},"bench":[]}}'></textarea><label>探索深度</label><input id="depth" type="number" value="4" min="1" max="8"><button class="p" onclick="battle()">探索</button><pre id="battleOut"></pre></section>
<section id="review"><h2>対戦レビュー</h2><textarea id="replayIn" placeholder='{"turns":[...]}'></textarea><button class="p" onclick="review()">採点</button><pre id="reviewOut"></pre></section>
</main>
<script src="./data.js"></script>
<script src="./mc-roster-additions.js"></script>
<script src="./mc-pokemon-data.js"></script>
<script src="./battle-engine.js"></script>
<script>
const ROOT="https://raw.githubusercontent.com/otterlyclueless/pokemon-champions-data/main/";
const n=s=>String(s||"").toLowerCase().replace(/[ -]/g,"");
async function j(p){let r=await fetch(ROOT+p);if(!r.ok)throw Error(p+" の取得に失敗");return r.json()}
function tab(id){document.querySelectorAll("section").forEach(x=>x.classList.remove("on"));document.getElementById(id).classList.add("on")}
function findP(x){return D.pokemon.find(p=>n(p.name)==n(x))}
function base(x){return D.base[n(x)]||{}}
function moves(x) {
  const p = LocalData.getPokemon(x);

  if (!p || !Array.isArray(p.moves)) {
    return [];
  }

  return p.moves.slice(0, 4);
}
window.makeTeam = function () {
  const names = document
    .getElementById("seed")
    .value
    .split(",")
    .map(x => x.trim())
    .filter(Boolean);

  const team = [];
  const used = new Set();

  function getRole(p) {
    const b = p.baseStats || {};

    const atk = Number(b.atk || 0);
    const spa = Number(b.spa || 0);
    const spe = Number(b.spe || 0);
    const hp  = Number(b.hp || 0);
    const def = Number(b.def || 0);
    const spd = Number(b.spd || 0);

    if (atk >= spa + 15) {
      return spe >= 90 ? "physical_fast" : "physical";
    }

    if (spa >= atk + 15) {
      return spe >= 90 ? "special_fast" : "special";
    }

    if (spe >= 100) {
      return "fast";
    }

    if (hp + def + spd >= 270) {
      return "bulk";
    }

    return atk >= spa ? "physical" : "special";
  }

function makeSP(p) {
  const b = p.baseStats || {};

  const sp = {
    hp: 0,
    atk: 0,
    def: 0,
    spa: 0,
    spd: 0,
    spe: 0
  };

  // ポケモンが覚えている技から物理・特殊の傾向を調べる
  const moveNames = Array.isArray(p.moves) ? p.moves : [];

  let physicalPower = 0;
  let specialPower = 0;

  for (const moveName of moveNames) {
    const move = LocalData.getMove(moveName);

    if (!move) continue;

    const power = Number(move.power || 0);

    if (move.category === "Physical") {
      physicalPower += power;
    }

    if (move.category === "Special") {
      specialPower += power;
    }
  }

  const atk = Number(b.atk || 0);
  const spa = Number(b.spa || 0);
  const spe = Number(b.spe || 0);
  const hp  = Number(b.hp || 0);
  const def = Number(b.def || 0);
  const spd = Number(b.spd || 0);

  let role;

  // 技構成を最優先して物理・特殊を判断
  if (physicalPower > specialPower && physicalPower > 0) {
    role = "physical";
  } else if (specialPower > physicalPower && specialPower > 0) {
    role = "special";
  } else if (atk > spa) {
    role = "physical";
  } else {
    role = "special";
  }

  // 素早さが高いポケモンはSも重視
  const fast = spe >= 90;

  // 耐久型の判定
  const bulky = hp + def + spd >= 270;

  let priority;

  if (bulky && physicalPower === 0 && specialPower === 0) {
    priority = ["hp", "def", "spd"];
  } else if (role === "physical" && fast) {
    priority = ["atk", "spe", "hp"];
  } else if (role === "physical") {
    priority = ["atk", "hp", "spe"];
  } else if (role === "special" && fast) {
    priority = ["spa", "spe", "hp"];
  } else {
    priority = ["spa", "hp", "spe"];
  }

  // 合計66、1能力最大32
  let remaining = 66;

  for (const stat of priority) {
    if (remaining <= 0) break;

    const amount = Math.min(32, remaining);

    sp[stat] = amount;
    remaining -= amount;
  }

  // 万一余った場合
  const allStats = ["hp", "atk", "def", "spa", "spd", "spe"];

  for (const stat of allStats) {
    if (remaining <= 0) break;

    const amount = Math.min(
      32 - sp[stat],
      remaining
    );

    sp[stat] += amount;
    remaining -= amount;
  }

  return sp;
}

  for (const name of names) {
    const p = findP(name);

    if (p && !used.has(n(p.name))) {
      team.push(p);
      used.add(n(p.name));
    }
  }

  for (const p of D.pokemon) {
    if (team.length >= 6) break;

    if (!used.has(n(p.name))) {
      team.push(p);
      used.add(n(p.name));
    }
  }
function chooseItem(p) {
  const b = p.baseStats || {};
  const moveNames = Array.isArray(p.moves) ? p.moves : [];

  let physical = 0;
  let special = 0;

  for (const moveName of moveNames) {
    const move = LocalData.getMove(moveName);

    if (!move) continue;

    if (move.category === "Physical") {
      physical += Number(move.power || 0);
    }

    if (move.category === "Special") {
      special += Number(move.power || 0);
    }
  }

  const atk = Number(b.atk || 0);
  const spa = Number(b.spa || 0);
  const spe = Number(b.spe || 0);
  const hp = Number(b.hp || 0);
  const def = Number(b.def || 0);
  const spd = Number(b.spd || 0);

  // 高速アタッカー
  if (spe >= 100) {
    return "Choice Scarf";
  }

  // 特殊アタッカー
  if (special > physical && spa >= atk) {
    return "Choice Specs";
  }

  // 物理アタッカー
  if (physical > special && atk >= spa) {
    return "Life Orb";
  }

  // 耐久型
  if (hp + def + spd >= 270) {
    return "Leftovers";
  }

  // 最後の候補
  return "Leftovers";
}
  const output = team.map(p => ({
    name: p.name,
    types: p.types || [],
    sp: makeSP(p),
    ability:
      Array.isArray(p.abilities)
        ? p.abilities[0] || ""
        : Object.values(p.abilities || {})[0] || "",
item: chooseItem(p),
    moves: moves(p.name)
  }));

  document.getElementById("teamOut").textContent =
    JSON.stringify(output, null, 2);
};
function legal(){
 try{let t=JSON.parse(document.getElementById("legalIn").value),e=[],seen=new Set();if(!Array.isArray(t)||t.length!=6)e.push("6体必要");
 t.forEach(p=>{if(seen.has(n(p.name)))e.push("同種重複: "+p.name);seen.add(n(p.name));let s=p.sp||{},sum=Object.values(s).reduce((a,b)=>a+(+b||0),0);if(sum>66)e.push(p.name+": SP合計66超過");if(Object.values(s).some(v=>+v>32))e.push(p.name+": 1能力32超過");if(!findP(p.name))e.push("未知ポケモン: "+p.name)});document.getElementById("legalOut").textContent=JSON.stringify({valid:e.length==0,errors:e},null,2)
 }catch(e){document.getElementById("legalOut").textContent=e.message}
}
function score(p){let b=base(p.name),s=["hp","atk","def","spa","spd","spe"].reduce((a,k)=>a+(+b[k]||0),0);return s}
function select3() {
  try {
    const myTeam = JSON.parse(
      document.getElementById("myIn").value
    );

    const oppTeam = JSON.parse(
      document.getElementById("opIn").value
    );

    if (!Array.isArray(myTeam) || myTeam.length !== 6) {
      throw new Error("自分の6体を入力してください");
    }

    if (!Array.isArray(oppTeam) || oppTeam.length !== 6) {
      throw new Error("相手の6体を入力してください");
    }

    // -----------------------------
    // タイプ相性
    // -----------------------------
    function typeEffect(moveType, targetTypes) {
      let multiplier = 1;

      for (const targetType of targetTypes || []) {
        const chart = LocalData.typeChart[moveType];

        if (chart && chart[targetType] !== undefined) {
          multiplier *= Number(chart[targetType]);
        }
      }

      return multiplier;
    }

    // -----------------------------
    // データ取得
    // -----------------------------
    function getBase(p) {
      return p.baseStats || base(p.name) || {};
    }

    function getMoves(p) {
      if (!Array.isArray(p.moves)) {
        return [];
      }

      return p.moves
        .map(m => {
          if (typeof m === "string") {
            return m;
          }

          return m && m.name;
        })
        .filter(Boolean);
    }

    function getMove(name) {
      return LocalData.getMove(name);
    }

    // -----------------------------
    // 物理・特殊攻撃力
    // -----------------------------
    function attackStat(p, move) {
      const b = getBase(p);

      if (move.category === "Physical") {
        return Number(b.atk || 0);
      }

      if (move.category === "Special") {
        return Number(b.spa || 0);
      }

      return 0;
    }

    // -----------------------------
    // 最大攻撃評価
    // -----------------------------
    function bestAttack(attacker, defender) {
      const movesList = getMoves(attacker);

      let best = {
        score: 0,
        move: null,
        effectiveness: 0
      };

      for (const moveName of movesList) {
        const move = getMove(moveName);

        if (!move) continue;

        if (move.category === "Status") {
          continue;
        }

        const power = Number(move.power || 0);

        if (power <= 0) {
          continue;
        }

        const atk = attackStat(
          attacker,
          move
        );

        const effectiveness = typeEffect(
          move.type,
          defender.types || []
        );

        // STAB
        const attackerTypes =
          attacker.types || [];

        const stab =
          attackerTypes.includes(move.type)
            ? 1.5
            : 1;

        // 命中率
        const accuracy =
          Number(move.accuracy || 100) / 100;

        const score =
          power *
          atk *
          effectiveness *
          stab *
          accuracy;

        if (score > best.score) {
          best = {
            score,
            move: moveName,
            effectiveness
          };
        }
      }

      return best;
    }

    // -----------------------------
    // 防御側の評価
    // -----------------------------
    function defensiveMatchup(
      defender,
      attacker
    ) {
      const result =
        bestAttack(
          attacker,
          defender
        );

      const b = getBase(defender);

      const hp =
        Number(b.hp || 0);

      const def =
        Number(b.def || 0);

      const spd =
        Number(b.spd || 0);

      const durability =
        hp + def + spd;

      // 相手からの最大打点
      const incoming =
        result.score;

      // 小さいほど安全
      return (
        durability -
        incoming / 50
      );
    }

    // -----------------------------
    // 1対1の対面評価
    // -----------------------------
    function matchup(attacker, defender) {
      const attack =
        bestAttack(
          attacker,
          defender
        );

      const defense =
        bestAttack(
          defender,
          attacker
        );

      let score = 0;

      // 攻撃性能
      score += attack.score / 100;

      // 相性
      if (attack.effectiveness >= 4) {
        score += 15;
      } else if (attack.effectiveness >= 2) {
        score += 8;
      } else if (attack.effectiveness === 0) {
        score -= 12;
      } else if (attack.effectiveness < 1) {
        score -= 5;
      }

      // 相手からの攻撃
      if (defense.effectiveness >= 4) {
        score -= 15;
      } else if (defense.effectiveness >= 2) {
        score -= 8;
      } else if (defense.effectiveness === 0) {
        score += 12;
      } else if (defense.effectiveness < 1) {
        score += 5;
      }

      // 素早さ
      const aBase =
        getBase(attacker);

      const dBase =
        getBase(defender);

      const aSpeed =
        Number(aBase.spe || 0);

      const dSpeed =
        Number(dBase.spe || 0);

      if (aSpeed > dSpeed) {
        score += 4;
      } else if (aSpeed < dSpeed) {
        score -= 4;
      }

      return {
        score: Number(score.toFixed(2)),
        bestMove: attack.move,
        bestMoveEffectiveness:
          attack.effectiveness,
        opponentBestMove:
          defense.move,
        opponentBestMoveEffectiveness:
          defense.effectiveness
      };
    }

    // -----------------------------
    // チーム全体評価
    // -----------------------------
    function evaluateTeam(team) {
      let total = 0;
      const details = [];

      for (const mine of team) {
        let best = -Infinity;
        let bestOpponent = null;
        let bestData = null;

        for (const opp of oppTeam) {
          const data =
            matchup(
              mine,
              opp
            );

          if (data.score > best) {
            best = data.score;
            bestOpponent = opp.name;
            bestData = data;
          }
        }

        total += best;

        details.push({
          pokemon: mine.name,
          bestMatchup: bestOpponent,
          score: bestData.score,
          bestMove: bestData.bestMove,
          opponentBestMove:
            bestData.opponentBestMove
        });
      }

      // 3体の役割バランス
      const roles = team.map(p => {
        const b = getBase(p);

        const atk =
          Number(b.atk || 0);

        const spa =
          Number(b.spa || 0);

        const spe =
          Number(b.spe || 0);

        if (atk >= spa + 20) {
          return "physical";
        }

        if (spa >= atk + 20) {
          return "special";
        }

        if (spe >= 100) {
          return "fast";
        }

        return "balanced";
      });

      const uniqueRoles =
        new Set(roles);

      total +=
        uniqueRoles.size * 3;

      return {
        score: Number(
          total.toFixed(2)
        ),
        details
      };
    }

    // -----------------------------
    // 6体から3体を全探索
    // -----------------------------
    const candidates = [];

    for (let i = 0; i < myTeam.length; i++) {
      for (
        let j = i + 1;
        j < myTeam.length;
        j++
      ) {
        for (
          let k = j + 1;
          k < myTeam.length;
          k++
        ) {
          const team = [
            myTeam[i],
            myTeam[j],
            myTeam[k]
          ];

          const evaluation =
            evaluateTeam(team);

          candidates.push({
            selection:
              team.map(
                p => p.name
              ),

            evaluation:
              evaluation.score,

            matchupDetails:
              evaluation.details
          });
        }
      }
    }

    candidates.sort(
      (a, b) =>
        b.evaluation -
        a.evaluation
    );

    // -----------------------------
    // 出力
    // -----------------------------
    const result = {
      input: {
        myTeam:
          myTeam.map(
            p => p.name
          ),

        opponentTeam:
          oppTeam.map(
            p => p.name
          )
      },

      candidates:
        candidates.slice(0, 10),

      note:
        "6→3対面評価：タイプ相性・STAB・技威力・攻撃能力・素早さ・相手からの打点を考慮"
    };

    document.getElementById(
      "selectOut"
    ).textContent =
      JSON.stringify(
        result,
        null,
        2
      );

  } catch (e) {
    document.getElementById(
      "selectOut"
    ).textContent =
      "エラー: " + e.message;
  }
}
function battle(){
 try{let s=JSON.parse(battleIn.value),a=s.me.active,d=s.opp.active,out=(a.moves||[]).map(m=>{let b=base(a.name),c=base(d.name),p=60,A=(b.atk||1)+20,D=(c.def||1)+20,raw=Math.floor(Math.floor(22*p*A/D)/50)+2;return{action:["move",m],estimatedDamage:[Math.floor(raw*.86),raw]}});out.sort((x,y)=>y.estimatedDamage[1]-x.estimatedDamage[1]);battleOut.textContent=JSON.stringify({depth:+depth.value,candidates:out,note:"ブラウザ版の軽量探索。特殊効果・全特性の完全再現は今後拡張可能"},null,2)}catch(e){battleOut.textContent=e.message}
}
function review(){try{let r=JSON.parse(replayIn.value);reviewOut.textContent=JSON.stringify({turns:r.turns||[],note:"入力ログを保持してレビューできます。AI比較は各ターンの状態JSONが必要です"},null,2)}catch(e){reviewOut.textContent=e.message}}
const D = {
  pokemon: LocalData.pokemon,
  moves: LocalData.moves,
  abilities: LocalData.abilities,
  items: LocalData.items,
  learnsets: {},
  base: Object.fromEntries(
    LocalData.pokemon.map(p => [
      p.name.toLowerCase(),
      p.baseStats
    ])
  )
};

console.log("Local Pokémon data loaded:", D.pokemon.length);
console.log("Local move data loaded:", Object.keys(D.moves).length);
console.log("Local ability data loaded:", Object.keys(D.abilities).length);
console.log("Local item data loaded:", Object.keys(D.items).length);
</script>
</body>
