<script>
/* =========================
   共通
========================= */

const ROOT =
  "https://raw.githubusercontent.com/otterlyclueless/pokemon-champions-data/main/";

const n = s =>
  String(s || "")
    .toLowerCase()
    .replace(/[ -]/g, "");


/* =========================
   タブ切り替え
========================= */

function tab(id) {
  document
    .querySelectorAll("section")
    .forEach(x => x.classList.remove("on"));

  const el = document.getElementById(id);

  if (el) {
    el.classList.add("on");
  }
}


/* =========================
   M-Cデータを安全に取得
========================= */

function mcPokemonList() {
  if (typeof MC_POKEMON_DATA === "undefined") {
    return [];
  }

  if (Array.isArray(MC_POKEMON_DATA)) {
    return MC_POKEMON_DATA;
  }

  if (typeof MC_POKEMON_DATA === "object") {
    return Object.entries(MC_POKEMON_DATA).map(
      ([name, data]) => ({
        name,
        ...(data || {})
      })
    );
  }

  return [];
}


function mcFind(name) {
  const list = mcPokemonList();

  return list.find(
    p => n(p.name) === n(name)
  );
}


/* =========================
   Dデータベース構築
========================= */

const basePokemon =
  Array.isArray(LocalData.pokemon)
    ? LocalData.pokemon
    : [];


const mcList = mcPokemonList();


/*
 * 同名ポケモンはM-Cデータを優先して統合
 */
const pokemonMap = new Map();


for (const p of basePokemon) {
  pokemonMap.set(n(p.name), {
    ...p
  });
}


for (const p of mcList) {
  const key = n(p.name);

  const old = pokemonMap.get(key) || {};

  pokemonMap.set(key, {
    ...old,
    ...p
  });
}


/*
 * M-C種族値を反映
 */
if (
  typeof MC_BASE_STATS !== "undefined" &&
  MC_BASE_STATS
) {
  for (const [name, stats] of Object.entries(MC_BASE_STATS)) {
    const key = n(name);
    const old = pokemonMap.get(key);

    if (old) {
      old.baseStats = {
        ...(old.baseStats || {}),
        ...stats
      };
    } else {
      pokemonMap.set(key, {
        name,
        types: [],
        baseStats: {
          ...stats
        },
        abilities: [],
        moves: []
      });
    }
  }
}


/*
 * M-C特性を反映
 */
if (
  typeof MC_ABILITIES !== "undefined" &&
  MC_ABILITIES
) {
  for (const [name, abilities] of Object.entries(MC_ABILITIES)) {
    const key = n(name);
    const old = pokemonMap.get(key);

    if (old) {
      old.abilities = Array.isArray(abilities)
        ? [...abilities]
        : abilities;
    }
  }
}


/*
 * M-CタイプをMC_POKEMON_DATAから補完
 */
for (const p of mcList) {
  const old = pokemonMap.get(n(p.name));

  if (!old) continue;

  if (Array.isArray(p.types) && p.types.length > 0) {
    old.types = [...p.types];
  }
}


/* =========================
   D本体
========================= */

const D = {

  pokemon: [...pokemonMap.values()],

  moves: {
    ...(LocalData.moves || {})
  },

  abilities: {
    ...(LocalData.abilities || {})
  },

  items: {
    ...(LocalData.items || {})
  },

  learnsets: {},

  base: {}
};


/*
 * M-C技
 */
if (
  typeof MC_MOVES !== "undefined" &&
  MC_MOVES
) {
  Object.assign(D.moves, MC_MOVES);
}


/*
 * 全ポケモンの種族値をD.baseへ
 */
for (const p of D.pokemon) {

  if (!p.name) continue;

  D.base[n(p.name)] = {
    ...(p.baseStats || {})
  };
}


/*
 * M-C種族値を最終上書き
 */
if (
  typeof MC_BASE_STATS !== "undefined" &&
  MC_BASE_STATS
) {
  for (const [name, stats] of Object.entries(MC_BASE_STATS)) {
    D.base[n(name)] = {
      ...(D.base[n(name)] || {}),
      ...stats
    };
  }
}


/* =========================
   ポケモン検索
========================= */

function findP(x) {

  return D.pokemon.find(
    p => n(p.name) === n(x)
  );
}


/* =========================
   種族値取得
========================= */

function base(x) {

  return D.base[n(x)] || {};
}


/* =========================
   技取得
========================= */

function movesForPokemon(x) {

  const p = findP(x);

  if (!p) {
    return [];
  }

  /*
   * ポケモン自身にmovesがあれば使う
   */
  if (
    Array.isArray(p.moves) &&
    p.moves.length > 0
  ) {
    return [
      ...new Set(
        p.moves
          .map(v =>
            typeof v === "string"
              ? v
              : v && v.move
          )
          .filter(Boolean)
      )
    ].slice(0, 4);
  }

  return [];
}


/* =========================
   デフォルトSP
========================= */

function defaultSP(name) {

  const p = findP(name);

  const b = base(name);

  /*
   * ポケモンごとの簡易型
   */

  const sp = {
    hp: 2,
    atk: 0,
    def: 0,
    spa: 0,
    spd: 0,
    spe: 32
  };

  if (!p) {
    return sp;
  }

  /*
   * 特殊寄り
   */
  if (
    (b.spa || 0) >
    (b.atk || 0)
  ) {
    sp.atk = 0;
    sp.spa = 32;
  } else {
    sp.atk = 32;
  }

  /*
   * 素早さが極端に低い場合
   */
  if ((b.spe || 0) < 60) {
    sp.spe = 2;
    sp.hp = 32;
  }

  return sp;
}


/* =========================
   デフォルト持ち物
========================= */

function defaultItem(name) {

  const p = findP(name);

  if (!p) {
    return "";
  }

  const b = base(name);

  if ((b.spa || 0) >= (b.atk || 0) + 15) {
    return "Choice Specs";
  }

  if ((b.spe || 0) >= 100) {
    return "Choice Scarf";
  }

  return "Leftovers";
}


/* =========================
   デフォルト特性
========================= */

function defaultAbility(name) {

  const p = findP(name);

  if (!p) {
    return "";
  }

  if (
    Array.isArray(p.abilities) &&
    p.abilities.length > 0
  ) {
    return p.abilities[0];
  }

  if (
    p.abilities &&
    typeof p.abilities === "object"
  ) {
    return Object.keys(p.abilities)[0] || "";
  }

  return "";
}


/* =========================
   ① パーティー構築
========================= */

window.makeTeam = function() {

  try {

    const seedEl =
      document.getElementById("seed");

    const outEl =
      document.getElementById("teamOut");

    const names =
      seedEl.value
        .split(",")
        .map(x => x.trim())
        .filter(Boolean);


    const team = [];

    const used = new Set();


    /*
     * 入力されたポケモンを優先
     */

    for (const name of names) {

      const p = findP(name);

      if (
        p &&
        !used.has(n(p.name))
      ) {

        team.push(p);

        used.add(n(p.name));
      }
    }


    /*
     * 足りない分をデータから補充
     */

    for (const p of D.pokemon) {

      if (team.length >= 6) {
        break;
      }

      if (
        !used.has(n(p.name))
      ) {

        team.push(p);

        used.add(n(p.name));
      }
    }


    /*
     * 最大6体
     */

    const result =
      team.slice(0, 6).map(p => {

        return {

          name: p.name,

          types:
            Array.isArray(p.types)
              ? [...p.types]
              : [],

          sp:
            defaultSP(p.name),

          ability:
            defaultAbility(p.name),

          item:
            defaultItem(p.name),

          moves:
            movesForPokemon(p.name)

        };

      });


    outEl.textContent =
      JSON.stringify(
        result,
        null,
        2
      );


  } catch (e) {

    document.getElementById(
      "teamOut"
    ).textContent =
      "エラー: " + e.message;

    console.error(e);
  }
};


/* =========================
   ② 合法性チェック
========================= */

function legal() {

  try {

    const input =
      document.getElementById(
        "legalIn"
      ).value;

    const t =
      JSON.parse(input);

    const errors = [];

    const seen =
      new Set();


    if (
      !Array.isArray(t) ||
      t.length !== 6
    ) {
      errors.push(
        "6体必要です"
      );
    }


    if (Array.isArray(t)) {

      for (const p of t) {

        if (!p || !p.name) {
          errors.push(
            "名前がないポケモンがあります"
          );
          continue;
        }


        const key =
          n(p.name);


        if (seen.has(key)) {

          errors.push(
            "同種重複: " + p.name
          );

        }

        seen.add(key);


        const data =
          findP(p.name);


        if (!data) {

          errors.push(
            "未知ポケモン: " +
            p.name
          );

          continue;
        }


        const sp =
          p.sp || {};


        const values =
          [
            "hp",
            "atk",
            "def",
            "spa",
            "spd",
            "spe"
          ].map(
            k => +sp[k] || 0
          );


        const sum =
          values.reduce(
            (a, b) => a + b,
            0
          );


        if (sum > 66) {

          errors.push(
            p.name +
            ": SP合計66超過"
          );

        }


        if (
          values.some(
            v => v > 32
          )
        ) {

          errors.push(
            p.name +
            ": 1能力32超過"
          );

        }


        if (
          Array.isArray(p.moves) &&
          p.moves.length > 4
        ) {

          errors.push(
            p.name +
            ": 技4つ超過"
          );

        }

      }
    }


    document.getElementById(
      "legalOut"
    ).textContent =
      JSON.stringify(
        {
          valid:
            errors.length === 0,
          errors
        },
        null,
        2
      );


  } catch (e) {

    document.getElementById(
      "legalOut"
    ).textContent =
      "JSONエラー: " +
      e.message;

  }
}


/* =========================
   タイプ相性
========================= */

function typeEffectiveness(
  moveType,
  defenderTypes
) {

  if (
    !Array.isArray(defenderTypes) ||
    defenderTypes.length === 0
  ) {
    return 1;
  }


  let multiplier = 1;


  for (
    const type of defenderTypes
  ) {

    const row =
      D.typeChart
        ? D.typeChart[moveType]
        : LocalData.typeChart[moveType];


    if (
      row &&
      row[type] !== undefined
    ) {

      multiplier *=
        row[type];

    }

  }


  return multiplier;
}


/*
 * LocalDataのタイプ表をDにも持たせる
 */

D.typeChart =
  LocalData.typeChart || {};


/* =========================
   技ダメージ評価
========================= */

function moveScore(
  attacker,
  defender,
  moveName
) {

  const move =
    D.moves[moveName];


  if (!move) {
    return {
      score: 0,
      damage: 0,
      move: moveName
    };
  }


  const b =
    base(attacker.name);


  const db =
    base(defender.name);


  const attackStat =
    move.category === "Special"
      ? (b.spa || 1)
      : (b.atk || 1);


  const defenseStat =
    move.category === "Special"
      ? (db.spd || 1)
      : (db.def || 1);


  const power =
    move.power || 0;


  if (power <= 0) {

    return {
      score: 10,
      damage: 0,
      move: moveName
    };

  }


  const stab =
    Array.isArray(attacker.types) &&
    attacker.types.includes(move.type)
      ? 1.5
      : 1;


  const effectiveness =
    typeEffectiveness(
      move.type,
      defender.types
    );


  const raw =
    Math.floor(
      (
        (
          22 *
          power *
          attackStat
        ) /
        Math.max(
          1,
          defenseStat
        )
      ) /
        50
    ) + 2;


  const damage =
    Math.max(
      0,
      Math.floor(
        raw *
        stab *
        effectiveness
      )
    );


  return {

    score:
      damage,

    damage,

    move:
      moveName,

    type:
      move.type,

    effectiveness,

    stab

  };
}


/* =========================
   ③ 6→3選出
========================= */

function select3() {

  try {

    const myTeam =
      JSON.parse(
        document.getElementById(
          "myIn"
        ).value
      );


    const opponentTeam =
      JSON.parse(
        document.getElementById(
          "opIn"
        ).value
      );


    if (
      !Array.isArray(myTeam) ||
      !Array.isArray(opponentTeam)
    ) {

      throw new Error(
        "自分と相手の6体をJSON配列で入力してください"
      );

    }


    const candidates = [];


    /*
     * 6体から3体を全探索
     */

    for (
      let i = 0;
      i < myTeam.length;
      i++
    ) {

      for (
        let j = i + 1;
        j < myTeam.length;
        j++
      ) {

        for (
          let k = j + 1;
          k < myTeam.length;
          k++
        ) {

          const selection = [
            myTeam[i],
            myTeam[j],
            myTeam[k]
          ];


          let total = 0;

          const details = [];


          for (
            const mine of selection
          ) {

            let best = null;


            for (
              const opp of opponentTeam
            ) {

              const myMoves =
                Array.isArray(mine.moves)
                  ? mine.moves
                  : movesForPokemon(
                      mine.name
                    );


              for (
                const moveName of myMoves
              ) {

                const result =
                  moveScore(
                    mine,
                    opp,
                    moveName
                  );


                if (
                  !best ||
                  result.score >
                    best.score
                ) {

                  best = {
                    opponent:
                      opp.name,

                    ...result
                  };

                }

              }

            }


            if (best) {

              total +=
                best.score;


              details.push({

                pokemon:
                  mine.name,

                bestMatchup:
                  best.opponent,

                score:
                  best.score,

                bestMove:
                  best.move,

                effectiveness:
                  best.effectiveness

              });

            }

          }


          candidates.push({

            selection:
              selection.map(
                x => x.name
              ),

            evaluation:
              Math.round(
                total * 10
              ) / 10,

            matchupDetails:
              details

          });

        }

      }

    }


    candidates.sort(
      (a, b) =>
        b.evaluation -
        a.evaluation
    );


    document.getElementById(
      "selectOut"
    ).textContent =
      JSON.stringify(
        {
          input: {
            myTeam:
              myTeam.map(
                x => x.name
              ),

            opponentTeam:
              opponentTeam.map(
                x => x.name
              )
          },

          candidates:
            candidates.slice(
              0,
              10
            ),

          note:
            "6→3対面評価：タイプ相性・STAB・技威力・攻撃能力・相手タイプを考慮"

        },
        null,
        2
      );


  } catch (e) {

    document.getElementById(
      "selectOut"
    ).textContent =
      "エラー: " +
      e.message;

    console.error(e);
  }
}

function battle(){
  try {
    const s = JSON.parse(battleIn.value);

    const me = s.me.active;
    const opp = s.opp.active;

    if (!me || !opp) {
      throw new Error("自分と相手のactiveポケモンが必要です");
    }

    const myData = findP(me.name);
    const oppData = findP(opp.name);

    if (!myData) {
      throw new Error("自分のポケモンが見つかりません: " + me.name);
    }

    if (!oppData) {
      throw new Error("相手のポケモンが見つかりません: " + opp.name);
    }

    const myBase = base(me.name);
    const oppBase = base(opp.name);

    const mySP = me.sp || {
      hp: 0, atk: 0, def: 0,
      spa: 0, spd: 0, spe: 0
    };

    const oppSP = opp.sp || {
      hp: 0, atk: 0, def: 0,
      spa: 0, spd: 0, spe: 0
    };

    function stat(name, key, isOpp=false){
      const b = isOpp ? oppBase : myBase;
      const sp = isOpp ? oppSP : mySP;

      return (+b[key] || 0) + (+sp[key] || 0);
    }

    /*
     * タイプ相性
     */
    function typeEffect(moveType, defenderTypes){
      let multiplier = 1;

      for (const type of defenderTypes || []) {
        const chart = LocalData.typeChart[moveType];

        if (chart && chart[type] !== undefined) {
          multiplier *= chart[type];
        }
      }

      return multiplier;
    }

    /*
     * STAB
     */
    function isSTAB(moveType, attackerTypes){
      return (attackerTypes || []).includes(moveType);
    }

    /*
     * 持ち物補正
     */
    function itemMultiplier(item, category){
      if (
        item === "Choice Specs" &&
        category === "Special"
      ) {
        return 1.5;
      }

      if (item === "Life Orb") {
        return 1.3;
      }

      return 1;
    }

    /*
     * 素早さ
     */
    function speedValue(pokemon, baseData, spData){
      let value =
        (+baseData.spe || 0) +
        (+spData.spe || 0);

      if (pokemon.item === "Choice Scarf") {
        value *= 1.5;
      }

      return value;
    }

    const mySpeed =
      speedValue(me, myBase, mySP);

    const oppSpeed =
      speedValue(opp, oppBase, oppSP);

    const candidates = [];

    /*
     * 技を1つずつ評価
     */
    for (const moveName of (me.moves || [])) {

      const move = LocalData.getMove(moveName);

      if (!move) {
        continue;
      }

      const effect =
        typeEffect(
          move.type,
          oppData.types || []
        );

      const stab =
        isSTAB(move.type, myData.types)
          ? 1.5
          : 1;

      let score = 0;
      let estimatedDamage = 0;
      const reason = [];

      /*
       * タイプ無効
       *
       * ここが今回の重要ポイント。
       * Status技にもタイプ相性を適用する。
       */
      if (effect === 0) {

        score = -100;

        reason.push("タイプ相性で無効");

        candidates.push({
          action: ["move", moveName],
          move: moveName,
          category: move.category,
          score,
          estimatedDamage: 0,
          typeEffect: effect,
          stab,
          usable: false,
          reason
        });

        continue;
      }

      /*
       * Protect
       */
      if (move.protect) {

        score = 40;

        if (oppSpeed >= mySpeed) {
          score += 10;
          reason.push("相手が先に動く可能性");
        }

        reason.push("Protect");

        candidates.push({
          action: ["move", moveName],
          move: moveName,
          category: move.category,
          score,
          estimatedDamage: 0,
          typeEffect: effect,
          stab,
          usable: true,
          reason
        });

        continue;
      }

      /*
       * 状態異常技
       */
      if (move.category === "Status") {

        if (move.status) {

          score = 55;

          /*
           * 状態異常がタイプ相性上有効なら評価
           */
          if (effect > 0) {
            score += 15;
            reason.push("状態異常が有効");
          }

          /*
           * 相手が先手なら状態異常の価値を少し上げる
           */
          if (oppSpeed >= mySpeed) {
            score += 5;
            reason.push("相手が先に動く可能性");
          }

          /*
           * GroundタイプへのElectric状態技など
           */
          if (effect < 1) {
            score -= 30;
            reason.push("タイプ相性で効果が弱い");
          }

          reason.push("状態異常");
        }

        /*
         * 能力上昇技
         */
        if (move.boosts) {

          score = Math.max(score, 35);

          for (const [statName, stages] of
               Object.entries(move.boosts)) {

            score += Math.abs(+stages || 0) * 10;

            reason.push(
              statName + "上昇"
            );
          }
        }

        candidates.push({
          action: ["move", moveName],
          move: moveName,
          category: move.category,
          score,
          estimatedDamage: 0,
          typeEffect: effect,
          stab,
          usable: true,
          reason
        });

        continue;
      }

      /*
       * 攻撃技
       */
      let attackStat;
      let defenseStat;

      if (move.category === "Physical") {

        attackStat =
          stat(me.name, "atk");

        defenseStat =
          stat(opp.name, "def", true);

      } else {

        attackStat =
          stat(me.name, "spa");

        defenseStat =
          stat(opp.name, "spd", true);
      }

      const power =
        +move.power || 0;

      if (power > 0 && defenseStat > 0) {

        const raw =
          Math.floor(
            (
              Math.floor(
                22 *
                power *
                attackStat /
                defenseStat
              ) / 50
            ) + 2
          );

        estimatedDamage =
          Math.max(
            0,
            Math.floor(
              raw *
              stab *
              effect *
              itemMultiplier(
                me.item || "",
                move.category
              )
            )
          );
      }

      score = estimatedDamage;

      /*
       * 弱点
       */
      if (effect >= 4) {

        score += 100;
        reason.push("4倍弱点");

      } else if (effect >= 2) {

        score += 50;
        reason.push("弱点");

      } else if (effect < 1) {

        score -= 25;
        reason.push("半減");
      }

      /*
       * STAB
       */
      if (stab > 1) {

        score += 20;
        reason.push("STAB");
      }

      /*
       * 先手
       */
      if (mySpeed > oppSpeed) {

        score += 10;
        reason.push("先手");

      } else {

        reason.push("後手");
      }

      /*
       * 命中率
       */
      if (
        move.accuracy &&
        move.accuracy < 100
      ) {

        score *=
          move.accuracy / 100;

        reason.push("命中率補正");
      }

      /*
       * Volt Switch
       */
      if (move.switchAfter) {

        score += 8;
        reason.push("交代可能");
      }

      candidates.push({
        action: ["move", moveName],
        move: moveName,
        category: move.category,
        score: Math.round(score * 10) / 10,
        estimatedDamage,
        typeEffect: effect,
        stab,
        usable: true,
        reason
      });
    }

    /*
     * スコア順
     */
    candidates.sort(
      (a, b) => b.score - a.score
    );

    const best =
      candidates.length
        ? candidates[0]
        : null;

    /*
     * 結果
     */
    battleOut.textContent =
      JSON.stringify(
        {
          input: {
            me: me.name,
            opponent: opp.name,
            myTypes: myData.types,
            opponentTypes: oppData.types,
            mySpeed,
            opponentSpeed: oppSpeed
          },

          bestAction: best,

          candidates,

          note:
            "タイプ相性・STAB・技威力・攻撃能力・防御能力・素早さ・持ち物・命中率・状態異常技のタイプ相性を考慮"
        },
        null,
        2
      );

  } catch(e) {

    battleOut.textContent =
      "エラー: " + e.message;
  }
}
