<script>
/* =========================
   共通
========================= */

const ROOT =
  "https://raw.githubusercontent.com/otterlyclueless/pokemon-champions-data/main/";

const n = s =>
  String(s || "")
    .toLowerCase()
    .replace(/[ -]/g, "");


/* =========================
   タブ切り替え
========================= */

function tab(id) {
  document
    .querySelectorAll("section")
    .forEach(x => x.classList.remove("on"));

  const el = document.getElementById(id);

  if (el) {
    el.classList.add("on");
  }
}


/* =========================
   M-Cデータを安全に取得
========================= */

function mcPokemonList() {
  if (typeof MC_POKEMON_DATA === "undefined") {
    return [];
  }

  if (Array.isArray(MC_POKEMON_DATA)) {
    return MC_POKEMON_DATA;
  }

  if (typeof MC_POKEMON_DATA === "object") {
    return Object.entries(MC_POKEMON_DATA).map(
      ([name, data]) => ({
        name,
        ...(data || {})
      })
    );
  }

  return [];
}


function mcFind(name) {
  const list = mcPokemonList();

  return list.find(
    p => n(p.name) === n(name)
  );
}


/* =========================
   Dデータベース構築
========================= */

const basePokemon =
  Array.isArray(LocalData.pokemon)
    ? LocalData.pokemon
    : [];


const mcList = mcPokemonList();


/*
 * 同名ポケモンはM-Cデータを優先して統合
 */
const pokemonMap = new Map();


for (const p of basePokemon) {
  pokemonMap.set(n(p.name), {
    ...p
  });
}


for (const p of mcList) {
  const key = n(p.name);

  const old = pokemonMap.get(key) || {};

  pokemonMap.set(key, {
    ...old,
    ...p
  });
}


/*
 * M-C種族値を反映
 */
if (
  typeof MC_BASE_STATS !== "undefined" &&
  MC_BASE_STATS
) {
  for (const [name, stats] of Object.entries(MC_BASE_STATS)) {
    const key = n(name);
    const old = pokemonMap.get(key);

    if (old) {
      old.baseStats = {
        ...(old.baseStats || {}),
        ...stats
      };
    } else {
      pokemonMap.set(key, {
        name,
        types: [],
        baseStats: {
          ...stats
        },
        abilities: [],
        moves: []
      });
    }
  }
}


/*
 * M-C特性を反映
 */
if (
  typeof MC_ABILITIES !== "undefined" &&
  MC_ABILITIES
) {
  for (const [name, abilities] of Object.entries(MC_ABILITIES)) {
    const key = n(name);
    const old = pokemonMap.get(key);

    if (old) {
      old.abilities = Array.isArray(abilities)
        ? [...abilities]
        : abilities;
    }
  }
}


/*
 * M-CタイプをMC_POKEMON_DATAから補完
 */
for (const p of mcList) {
  const old = pokemonMap.get(n(p.name));

  if (!old) continue;

  if (Array.isArray(p.types) && p.types.length > 0) {
    old.types = [...p.types];
  }
}


/* =========================
   D本体
========================= */

const D = {

  pokemon: [...pokemonMap.values()],

  moves: {
    ...(LocalData.moves || {})
  },

  abilities: {
    ...(LocalData.abilities || {})
  },

  items: {
    ...(LocalData.items || {})
  },

  learnsets: {},

  base: {}
};


/*
 * M-C技
 */
if (
  typeof MC_MOVES !== "undefined" &&
  MC_MOVES
) {
  Object.assign(D.moves, MC_MOVES);
}


/*
 * 全ポケモンの種族値をD.baseへ
 */
for (const p of D.pokemon) {

  if (!p.name) continue;

  D.base[n(p.name)] = {
    ...(p.baseStats || {})
  };
}


/*
 * M-C種族値を最終上書き
 */
if (
  typeof MC_BASE_STATS !== "undefined" &&
  MC_BASE_STATS
) {
  for (const [name, stats] of Object.entries(MC_BASE_STATS)) {
    D.base[n(name)] = {
      ...(D.base[n(name)] || {}),
      ...stats
    };
  }
}


/* =========================
   ポケモン検索
========================= */

function findP(x) {

  return D.pokemon.find(
    p => n(p.name) === n(x)
  );
}


/* =========================
   種族値取得
========================= */

function base(x) {

  return D.base[n(x)] || {};
}


/* =========================
   技取得
========================= */

function movesForPokemon(x) {

  const p = findP(x);

  if (!p) {
    return [];
  }

  /*
   * ポケモン自身にmovesがあれば使う
   */
  if (
    Array.isArray(p.moves) &&
    p.moves.length > 0
  ) {
    return [
      ...new Set(
        p.moves
          .map(v =>
            typeof v === "string"
              ? v
              : v && v.move
          )
          .filter(Boolean)
      )
    ].slice(0, 4);
  }

  return [];
}


/* =========================
   デフォルトSP
========================= */

function defaultSP(name) {

  const p = findP(name);

  const b = base(name);

  /*
   * ポケモンごとの簡易型
   */

  const sp = {
    hp: 2,
    atk: 0,
    def: 0,
    spa: 0,
    spd: 0,
    spe: 32
  };

  if (!p) {
    return sp;
  }

  /*
   * 特殊寄り
   */
  if (
    (b.spa || 0) >
    (b.atk || 0)
  ) {
    sp.atk = 0;
    sp.spa = 32;
  } else {
    sp.atk = 32;
  }

  /*
   * 素早さが極端に低い場合
   */
  if ((b.spe || 0) < 60) {
    sp.spe = 2;
    sp.hp = 32;
  }

  return sp;
}


/* =========================
   デフォルト持ち物
========================= */

function defaultItem(name) {

  const p = findP(name);

  if (!p) {
    return "";
  }

  const b = base(name);

  if ((b.spa || 0) >= (b.atk || 0) + 15) {
    return "Choice Specs";
  }

  if ((b.spe || 0) >= 100) {
    return "Choice Scarf";
  }

  return "Leftovers";
}


/* =========================
   デフォルト特性
========================= */

function defaultAbility(name) {

  const p = findP(name);

  if (!p) {
    return "";
  }

  if (
    Array.isArray(p.abilities) &&
    p.abilities.length > 0
  ) {
    return p.abilities[0];
  }

  if (
    p.abilities &&
    typeof p.abilities === "object"
  ) {
    return Object.keys(p.abilities)[0] || "";
  }

  return "";
}


/* =========================
   ① パーティー構築
========================= */

window.makeTeam = function() {

  try {

    const seedEl =
      document.getElementById("seed");

    const outEl =
      document.getElementById("teamOut");

    const names =
      seedEl.value
        .split(",")
        .map(x => x.trim())
        .filter(Boolean);


    const team = [];

    const used = new Set();


    /*
     * 入力されたポケモンを優先
     */

    for (const name of names) {

      const p = findP(name);

      if (
        p &&
        !used.has(n(p.name))
      ) {

        team.push(p);

        used.add(n(p.name));
      }
    }


    /*
     * 足りない分をデータから補充
     */

    for (const p of D.pokemon) {

      if (team.length >= 6) {
        break;
      }

      if (
        !used.has(n(p.name))
      ) {

        team.push(p);

        used.add(n(p.name));
      }
    }


    /*
     * 最大6体
     */

    const result =
      team.slice(0, 6).map(p => {

        return {

          name: p.name,

          types:
            Array.isArray(p.types)
              ? [...p.types]
              : [],

          sp:
            defaultSP(p.name),

          ability:
            defaultAbility(p.name),

          item:
            defaultItem(p.name),

          moves:
            movesForPokemon(p.name)

        };

      });


    outEl.textContent =
      JSON.stringify(
        result,
        null,
        2
      );


  } catch (e) {

    document.getElementById(
      "teamOut"
    ).textContent =
      "エラー: " + e.message;

    console.error(e);
  }
};


/* =========================
   ② 合法性チェック
========================= */

function legal() {

  try {

    const input =
      document.getElementById(
        "legalIn"
      ).value;

    const t =
      JSON.parse(input);

    const errors = [];

    const seen =
      new Set();


    if (
      !Array.isArray(t) ||
      t.length !== 6
    ) {
      errors.push(
        "6体必要です"
      );
    }


    if (Array.isArray(t)) {

      for (const p of t) {

        if (!p || !p.name) {
          errors.push(
            "名前がないポケモンがあります"
          );
          continue;
        }


        const key =
          n(p.name);


        if (seen.has(key)) {

          errors.push(
            "同種重複: " + p.name
          );

        }

        seen.add(key);


        const data =
          findP(p.name);


        if (!data) {

          errors.push(
            "未知ポケモン: " +
            p.name
          );

          continue;
        }


        const sp =
          p.sp || {};


        const values =
          [
            "hp",
            "atk",
            "def",
            "spa",
            "spd",
            "spe"
          ].map(
            k => +sp[k] || 0
          );


        const sum =
          values.reduce(
            (a, b) => a + b,
            0
          );


        if (sum > 66) {

          errors.push(
            p.name +
            ": SP合計66超過"
          );

        }


        if (
          values.some(
            v => v > 32
          )
        ) {

          errors.push(
            p.name +
            ": 1能力32超過"
          );

        }


        if (
          Array.isArray(p.moves) &&
          p.moves.length > 4
        ) {

          errors.push(
            p.name +
            ": 技4つ超過"
          );

        }

      }
    }


    document.getElementById(
      "legalOut"
    ).textContent =
      JSON.stringify(
        {
          valid:
            errors.length === 0,
          errors
        },
        null,
        2
      );


  } catch (e) {

    document.getElementById(
      "legalOut"
    ).textContent =
      "JSONエラー: " +
      e.message;

  }
}


/* =========================
   タイプ相性
========================= */

function typeEffectiveness(
  moveType,
  defenderTypes
) {

  if (
    !Array.isArray(defenderTypes) ||
    defenderTypes.length === 0
  ) {
    return 1;
  }


  let multiplier = 1;


  for (
    const type of defenderTypes
  ) {

    const row =
      D.typeChart
        ? D.typeChart[moveType]
        : LocalData.typeChart[moveType];


    if (
      row &&
      row[type] !== undefined
    ) {

      multiplier *=
        row[type];

    }

  }


  return multiplier;
}


/*
 * LocalDataのタイプ表をDにも持たせる
 */

D.typeChart =
  LocalData.typeChart || {};


/* =========================
   技ダメージ評価
========================= */

function moveScore(
  attacker,
  defender,
  moveName
) {

  const move =
    D.moves[moveName];


  if (!move) {
    return {
      score: 0,
      damage: 0,
      move: moveName
    };
  }


  const b =
    base(attacker.name);


  const db =
    base(defender.name);


  const attackStat =
    move.category === "Special"
      ? (b.spa || 1)
      : (b.atk || 1);


  const defenseStat =
    move.category === "Special"
      ? (db.spd || 1)
      : (db.def || 1);


  const power =
    move.power || 0;


  if (power <= 0) {

    return {
      score: 10,
      damage: 0,
      move: moveName
    };

  }


  const stab =
    Array.isArray(attacker.types) &&
    attacker.types.includes(move.type)
      ? 1.5
      : 1;


  const effectiveness =
    typeEffectiveness(
      move.type,
      defender.types
    );


  const raw =
    Math.floor(
      (
        (
          22 *
          power *
          attackStat
        ) /
        Math.max(
          1,
          defenseStat
        )
      ) /
        50
    ) + 2;


  const damage =
    Math.max(
      0,
      Math.floor(
        raw *
        stab *
        effectiveness
      )
    );


  return {

    score:
      damage,

    damage,

    move:
      moveName,

    type:
      move.type,

    effectiveness,

    stab

  };
}


/* =========================
   ③ 6→3選出
========================= */

function select3() {

  try {

    const myTeam =
      JSON.parse(
        document.getElementById(
          "myIn"
        ).value
      );


    const opponentTeam =
      JSON.parse(
        document.getElementById(
          "opIn"
        ).value
      );


    if (
      !Array.isArray(myTeam) ||
      !Array.isArray(opponentTeam)
    ) {

      throw new Error(
        "自分と相手の6体をJSON配列で入力してください"
      );

    }


    const candidates = [];


    /*
     * 6体から3体を全探索
     */

    for (
      let i = 0;
      i < myTeam.length;
      i++
    ) {

      for (
        let j = i + 1;
        j < myTeam.length;
        j++
      ) {

        for (
          let k = j + 1;
          k < myTeam.length;
          k++
        ) {

          const selection = [
            myTeam[i],
            myTeam[j],
            myTeam[k]
          ];


          let total = 0;

          const details = [];


          for (
            const mine of selection
          ) {

            let best = null;


            for (
              const opp of opponentTeam
            ) {

              const myMoves =
                Array.isArray(mine.moves)
                  ? mine.moves
                  : movesForPokemon(
                      mine.name
                    );


              for (
                const moveName of myMoves
              ) {

                const result =
                  moveScore(
                    mine,
                    opp,
                    moveName
                  );


                if (
                  !best ||
                  result.score >
                    best.score
                ) {

                  best = {
                    opponent:
                      opp.name,

                    ...result
                  };

                }

              }

            }


            if (best) {

              total +=
                best.score;


              details.push({

                pokemon:
                  mine.name,

                bestMatchup:
                  best.opponent,

                score:
                  best.score,

                bestMove:
                  best.move,

                effectiveness:
                  best.effectiveness

              });

            }

          }


          candidates.push({

            selection:
              selection.map(
                x => x.name
              ),

            evaluation:
              Math.round(
                total * 10
              ) / 10,

            matchupDetails:
              details

          });

        }

      }

    }


    candidates.sort(
      (a, b) =>
        b.evaluation -
        a.evaluation
    );


    document.getElementById(
      "selectOut"
    ).textContent =
      JSON.stringify(
        {
          input: {
            myTeam:
              myTeam.map(
                x => x.name
              ),

            opponentTeam:
              opponentTeam.map(
                x => x.name
              )
          },

          candidates:
            candidates.slice(
              0,
              10
            ),

          note:
            "6→3対面評価：タイプ相性・STAB・技威力・攻撃能力・相手タイプを考慮"

        },
        null,
        2
      );


  } catch (e) {

    document.getElementById(
      "selectOut"
    ).textContent =
      "エラー: " +
      e.message;

    console.error(e);
  }
}

        Fairy:0.5
      },

      Rock: {
        Fire:2,
        Ice:2,
        Fighting:0.5,
        Ground:0.5,
        Flying:2,
        Bug:2,
        Steel:0.5
      },

      Ghost: {
        Normal:0,
        Psychic:2,
        Ghost:2,
        Dark:0.5
      },

      Dragon: {
        Dragon:2,
        Steel:0.5,
        Fairy:0
      },

      Dark: {
        Fighting:0.5,
        Psychic:2,
        Ghost:2,
        Dark:0.5,
        Fairy:0.5
      },

      Steel: {
        Fire:0.5,
        Water:0.5,
        Electric:0.5,
        Ice:2,
        Rock:2,
        Fairy:2,
        Steel:0.5
      },

      Fairy: {
        Fire:0.5,
        Fighting:2,
        Poison:0.5,
        Dragon:2,
        Dark:2,
        Steel:0.5
      }
    };

    function effectiveness(moveType, defenderTypes){
      let value = 1;

      for(const type of defenderTypes){
        value *=
          typeChart[moveType]?.[type] ?? 1;
      }

      return value;
    }

    function moveData(moveName){
      const key =
        Object.keys(D.moves || {}).find(
          x => n(x) === n(moveName)
        );

      return key ? D.moves[key] : null;
    }

    function moveType(moveName){
      const d = moveData(moveName);

      if(typeof d === "object" && d){
        return d.type || "Normal";
      }

      return "Normal";
    }

    function movePower(moveName){
      const d = moveData(moveName);

      if(typeof d === "object" && d){
        return Number(d.power || 0);
      }

      return 0;
    }

    function moveCategory(moveName){
      const d = moveData(moveName);

      if(typeof d === "object" && d){
        return d.category || "Status";
      }

      return "Status";
    }

    function moveAccuracy(moveName){
      const d = moveData(moveName);

      if(typeof d === "object" && d){
        return Number(d.accuracy ?? 100);
      }

      return 100;
    }

    function stabFor(types, type){
      return types.includes(type) ? 1.5 : 1;
    }

    /*
     * 技ダメージ
     */
    function damage(
      attackerName,
      defenderName,
      attackerTypes,
      defenderTypes,
      moveName
    ){
      const attackerBase = base(attackerName);
      const defenderBase = base(defenderName);

      const category = moveCategory(moveName);
      const power = movePower(moveName);

      if(category === "Status" || power <= 0){
        return 0;
      }

      const type = moveType(moveName);

      const effect =
        effectiveness(type, defenderTypes);

      if(effect === 0){
        return 0;
      }

      let attack;
      let defense;

      if(category === "Physical"){
        attack = Number(attackerBase.atk || 1);
        defense = Number(defenderBase.def || 1);
      }else{
        attack = Number(attackerBase.spa || 1);
        defense = Number(defenderBase.spd || 1);
      }

      const raw =
        Math.floor(
          Math.floor(
            ((2 * 50 / 5) + 2) *
            power *
            attack /
            defense
          ) / 50
        ) + 2;

      return Math.floor(
        raw *
        stabFor(attackerTypes,type) *
        effect
      );
    }

    /*
     * 現在のポケモンが相手に与えられる
     * 最大ダメージを調べる
     */
    function bestDamage(
      attackerName,
      defenderName,
      attackerTypes,
      defenderTypes,
      attackerMoves
    ){
      let best = null;

      for(const move of attackerMoves){

        const d =
          damage(
            attackerName,
            defenderName,
            attackerTypes,
            defenderTypes,
            move
          );

        const type =
          moveType(move);

        const effect =
          effectiveness(
            type,
            defenderTypes
          );

        if(
          !best ||
          d > best.damage
        ){
          best = {
            move,
            damage:d,
            typeEffect:effect
          };
        }
      }

      return best;
    }

    const candidates = [];

    /*
     * 技を評価
     */
    for(const move of myMoves){

      const category =
        moveCategory(move);

      const type =
        moveType(move);

      const accuracy =
        moveAccuracy(move);

      const effect =
        effectiveness(
          type,
          oppTypes
        );

      const stab =
        stabFor(myTypes,type);

      const estimatedDamage =
        damage(
          myName,
          oppName,
          myTypes,
          oppTypes,
          move
        );

      let score = 0;
      const reason = [];

      /*
       * 素早さ
       */
      if(mySpeed < opponentSpeed){
        score -= 10;
        reason.push("相手が先に動く可能性");
      }else{
        score += 10;
        reason.push("こちらが先に動く可能性");
      }

      /*
       * タイプ相性
       */
      if(effect === 0){

        score -= 100;
        reason.push("無効");

      }else if(effect >= 2){

        score += 50;
        reason.push("効果抜群");

      }else if(effect < 1){

        score -= 30;
        reason.push("いまひとつ");
      }

      /*
       * STAB
       */
      if(stab > 1){
        score += 10;
        reason.push("STAB");
      }

      /*
       * ダメージ
       */
      score += estimatedDamage;

      /*
       * 命中率
       */
      if(accuracy < 100){
        score -=
          (100 - accuracy) * 0.2;
      }

      /*
       * Protect
       */
      if(n(move) === "protect"){

        score += 20;
        reason.push("Protect");

      }

      /*
       * 状態異常
       */
      if(
        category === "Status" &&
        n(move) !== "protect" &&
        effect !== 0
      ){

        score += 35;
        reason.push("状態異常");

      }

      /*
       * Volt Switch
       */
      if(
        n(move) === "voltswitch" &&
        effect !== 0
      ){

        score += 10;
        reason.push("交代可能");

      }

      candidates.push({
        action:["move",move],
        move,
        category,
        score:
          Math.round(score * 10) / 10,
        estimatedDamage,
        typeEffect:effect,
        stab,
        accuracy,
        reason
      });
    }

    /*
     * =========================
     * 交代候補
     * =========================
     */

    const bench =
      Array.isArray(me.bench)
        ? me.bench
        : [];

    for(const benchPokemon of bench){

      const name =
        typeof benchPokemon === "string"
          ? benchPokemon
          : benchPokemon.name;

      if(!name) continue;

      if(n(name) === n(myName)){
        continue;
      }

      const p = findP(name);

      if(!p){
        continue;
      }

      const types =
        p.types || [];

      const b =
        base(name);

      const opponentBest =
        bestDamage(
          oppName,
          name,
          oppTypes,
          types,
          oppMoves
        );

      const myBest =
        bestDamage(
          name,
          oppName,
          types,
          oppTypes,
          Array.isArray(
            benchPokemon.moves
          )
            ? benchPokemon.moves
            : moves(name)
        );

      let score = 20;
      const reason = [];

      /*
       * 相手からの最大打点
       */
      if(opponentBest){

        if(opponentBest.typeEffect === 0){

          score += 45;
          reason.push(
            "相手の主力技を無効化できる可能性"
          );

        }else if(opponentBest.typeEffect <= 0.5){

          score += 30;
          reason.push(
            "相手の攻撃を軽減しやすい"
          );

        }else if(opponentBest.typeEffect >= 2){

          score -= 45;
          reason.push(
            "相手の攻撃が弱点"
          );
        }
      }

      /*
       * 交代先からの打点
       */
      if(myBest){

        if(myBest.typeEffect >= 2){

          score += 45;
          reason.push(
            "交代先から効果抜群を狙える"
          );

        }else if(myBest.typeEffect === 1){

          score += 10;
          reason.push(
            "相手に等倍打点"
          );

        }else if(myBest.typeEffect === 0){

          score -= 25;
          reason.push(
            "相手への攻撃が無効"
          );
        }
      }

      /*
       * 素早さ
       */
      const speed =
        Number(
          benchPokemon.speed ??
          b.spe ??
          0
        );

      if(speed > opponentSpeed){

        score += 10;
        reason.push(
          "交代先が相手より速い"
        );

      }else{

        score -= 5;
        reason.push(
          "交代先が相手より遅い"
        );
      }

      candidates.push({
        action:["switch",name],
        move:null,
        category:"Switch",
        score:
          Math.round(score * 10) / 10,
        estimatedDamage:
          myBest?.damage ?? 0,
        incomingDamage:
          opponentBest?.damage ?? 0,
        typeEffect:
          myBest?.typeEffect ?? 1,
        reason
      });
    }

    /*
     * スコア順
     */
    candidates.sort(
      (a,b) =>
        b.score - a.score
    );

    const result = {

      input:{
        me:myName,
        opponent:oppName,
        mySpeed,
        opponentSpeed
      },

      bestAction:
        candidates[0] || null,

      candidates:

        candidates.slice(0,10),

      note:
        "技だけでなくベンチへの交代候補も評価するブラウザ版軽量対戦AI"
    };

document.getElementById("battleOut").textContent =
  formatBattleJapanese(result);

  }catch(e){

    document.getElementById(
      "battleOut"
    ).textContent =
      "エラー: " + e.message;

    console.error(e);
  }
}

function formatBattleJapanese(data) {
  if (!data) return "AIの結果がありません。";

  const best = data.bestAction;
  const candidates = data.candidates || [];

  let text = "";

  text += "🧠 対戦AIのおすすめ\n";
  text += "━━━━━━━━━━━━━━━━\n\n";

  if (best) {
    if (best.action && best.action[0] === "switch") {
      const target = best.action[1];

      text += "🔄 おすすめ：";
      text += target + " に交代\n\n";

      text += "【理由】\n";

      if (best.reason && best.reason.length) {
        best.reason.forEach(r => {
          text += "・" + translateBattleReason(r) + "\n";
        });
      }

      if (best.estimatedDamage != null) {
        text += "\n【予想ダメージ】\n";
        text += "・相手に与える：約" + best.estimatedDamage + "\n";
      }

      if (best.incomingDamage != null) {
        text += "・自分が受ける：約" + best.incomingDamage + "\n";
      }

    } else if (best.action && best.action[0] === "move") {
      text += "⚔️ おすすめ技：";
      text += (best.move || best.action[1]) + "\n\n";

      text += "【理由】\n";

      if (best.reason && best.reason.length) {
        best.reason.forEach(r => {
          text += "・" + translateBattleReason(r) + "\n";
        });
      }

      if (best.estimatedDamage != null) {
        text += "\n【予想ダメージ】\n";
        text += "・約" + best.estimatedDamage + "\n";
      }
    }
  }

  text += "\n━━━━━━━━━━━━━━━━\n";
  text += "📋 その他の候補\n\n";

  candidates.forEach((c, i) => {
    const action = c.action || [];

    text += (i + 1) + ". ";

    if (action[0] === "switch") {
      text += "🔄 " + action[1] + " に交代";
    } else if (action[0] === "move") {
      text += "⚔️ " + (c.move || action[1]);
    } else {
      text += action.join(" ");
    }

    if (c.score != null) {
      text += "　（評価：" + c.score + "）";
    }

    text += "\n";

    if (c.reason && c.reason.length) {
      text += "   理由：";
      text += c.reason.map(translateBattleReason).join("、");
      text += "\n";
    }

    if (c.estimatedDamage != null && c.estimatedDamage > 0) {
      text += "   与ダメージ：約" + c.estimatedDamage + "\n";
    }

    if (c.incomingDamage != null && c.incomingDamage > 0) {
      text += "   被ダメージ：約" + c.incomingDamage + "\n";
    }

    text += "\n";
  });

  return text;
}


function translateBattleReason(reason) {
  const map = {
    "無効": "相手には無効",
    "半減": "相手に半減される",
    "効果いまひとつ": "効果はいまひとつ",
    "効果抜群": "効果抜群を狙える",
    "STAB": "タイプ一致技",
    "状態異常": "状態異常を狙える",
    "Protect": "Protectで相手の攻撃を防げる",
    "交代可能": "攻撃後に交代できる",
    "相手が先に動く可能性": "相手が先に動く可能性がある",
    "交代先から効果抜群を狙える": "交代先から効果抜群を狙える",
    "交代先が相手より遅い": "交代先のほうが相手より遅い",
    "相手の攻撃が弱点": "相手の攻撃が弱点になる",
    "相手に等倍打点": "相手に等倍のダメージを与えられる"
  };

  return map[reason] || reason;
}

    const replay =
      JSON.parse(
        document.getElementById(
          "replayIn"
        ).value
      );


    const turns =
      Array.isArray(
        replay.turns

          note:
            "入力された対戦ログを解析する基礎版。各ターンの状態JSONがあれば、AI候補との比較を追加できます。"

        },
        null,
        2
      );


  } catch (e) {

    document.getElementById(
      "reviewOut"
    ).textContent =
      "JSONエラー: " +
      e.message;

  }
}
